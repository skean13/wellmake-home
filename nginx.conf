server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/plain;

    # 보안 헤더 (location 블록에서 add_header를 쓰지 않아 모든 응답에 적용됩니다)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # HTML은 항상 최신본을 받도록
    location = /index.html {
        expires -1;
    }

    # CSS/JS는 1주일 캐시
    location ~* \.(css|js)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 숨김 파일 차단
    location ~ /\. {
        deny all;
    }
}
